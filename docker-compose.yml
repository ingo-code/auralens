services:
  auralens:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3100:3000"
    env_file:
      - .env.local
    environment:
      # Overrides NEXT_PUBLIC_SUPABASE_URL for server-side calls so the
      # container can reach a local `supabase start` stack on the host.
      # Not needed when NEXT_PUBLIC_SUPABASE_URL already points at a
      # hosted Supabase project.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      # host.docker.internal resolves to both an IPv4 and an IPv6 address on
      # Docker Desktop, and the IPv6 route is unreachable in this setup -
      # Node's dual-stack resolver intermittently tries it first and hangs.
      # Forcing IPv4 first avoids that flaky path entirely.
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    extra_hosts:
      - "host.docker.internal:host-gateway"
